; ============================================================================
; ESP-P4d - Fröling Lambdatronic S3200 auslesen (COM1) mit Wemos S2 Mini
; ============================================================================
; COM1-Protokoll + WLAN-Baustein (Einrichtungs-AP, Weboberflaeche, OTA).
; Werte-Katalog/Historie/MQTT folgen (siehe ../machbarkeitsanalyse.md).

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino

monitor_speed = 115200

; Standard-Partitionierung (4 MB): 2x 1,25 MB OTA-Slots + 1,4 MB Datenpartition.
; Laufzeit-Dateisystem ist LittleFS (config.json, spaeter Historie/CSV).
board_build.filesystem = littlefs

lib_deps =
    esp32async/ESPAsyncWebServer@^3.11.2
    esp32async/AsyncTCP@^3.4.10
    bblanchon/ArduinoJson@^7.4.3

; Debug-Ausgaben laufen ueber den nativen USB (USB-CDC = "Serial"); UART1
; (Serial1) ist fuer den MAX3232 an COM1 der Heizung reserviert.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
