; ============================================================================
; ESP-P4d - Fröling Lambdatronic S3200 auslesen (COM1) mit Wemos S2 Mini
; ============================================================================
; Milestone 1: COM1-Protokoll-Modul + Proof-of-Life (cmdCheck/cmdGetVersion).
; Netz/Web/OTA/Historie/MQTT folgen (siehe ../machbarkeitsanalyse.md).

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino

monitor_speed = 115200

; Debug-Ausgaben laufen ueber den nativen USB (USB-CDC = "Serial"); UART1
; (Serial1) ist fuer den MAX3232 an COM1 der Heizung reserviert.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
